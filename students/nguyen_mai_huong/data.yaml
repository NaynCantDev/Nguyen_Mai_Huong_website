  - id: 5
    section: "5.4"
    title: "Sử dụng AI tạo sinh để hỗ trợ sáng tạo nội dung"
    chapter: "Chương 5 – Sáng tạo nội dung số"
    # Nguồn: "BÀI TẬP NHÓM GIỮA KỲ NHÓM 4" (Google Docs). Trang này là bản tóm tắt; bản gốc ở cuối trang.
    objective: "Bài tập nhóm giữa kỳ của Nhóm 4: viết kịch bản và sản xuất một video 5 phút với đề tài “Ứng dụng AI & Công nghệ số trong dạy và học Guitar”, giới thiệu 3 công cụ (GuitarTuna, Hợp Âm Chuẩn, ChatGPT/Gemini), phân tích hạn chế và cách khắc phục của từng công cụ. Kỹ năng được rèn luyện: xây dựng kịch bản nội dung số, dựng video và thiết kế đồ họa, tìm hiểu cách AI hỗ trợ việc dạy và học nhạc cụ, nhìn nhận công nghệ một cách phản biện. Trong video, mình cùng bạn Phạm Thanh Huyền phụ trách phần giới thiệu chủ đề."
    process:
      - "Bước 1: Nhóm chốt đề tài “Ứng dụng AI & Công nghệ số trong dạy và học Guitar” và chia video 5 phút thành 5 phần có thời lượng cụ thể."
      - "Bước 2: Viết kịch bản phần mở đầu theo một tình huống thực tế: bạn Kiên gặp khó khăn khi học đàn guitar, bạn Hưng và bạn Thanh Hương giới thiệu cho Kiên các công cụ AI hỗ trợ; mình và bạn Huyền giới thiệu chủ đề."
      - "Bước 3: Tìm hiểu và trình bày 3 công cụ theo cùng một khung: định nghĩa, nguyên lý hoạt động của AI và công nghệ, tính năng cốt lõi."
      - "Bước 4: Lập bảng hạn chế và cách khắc phục của 3 công cụ, chốt thông điệp kết: công nghệ là trợ lý, không thay thế được người thầy."
      - "Bước 5: Quay video, dựng hậu kỳ bằng CapCut và thiết kế đồ họa chú thích (lower-third), slide bằng Canva."
      - "AI: ChatGPT/Gemini được dùng như trợ lý sư phạm để lập lộ trình học guitar cá nhân hóa (nội dung minh họa trong video); tính năng khử nhiễu (Noise Reduction) của CapCut dùng để làm trong tiếng đàn."
      - "Khó khăn: Thu âm tiếng đàn guitar trực tiếp vào video dễ lẫn tạp âm phòng và tiếng ồn xung quanh – nhóm dùng tính năng khử nhiễu (Noise Reduction) của CapCut để làm trong tiếng đàn."
      - "Khó khăn: Lúc đầu phần trình bày của 5 thành viên vượt quá 5 phút cho phép – nhóm rà soát kịch bản, cô đọng lời thoại và tập căn thời gian trước khi quay chính thức."
    tool: "CapCut (dựng video, khử nhiễu), Canva (đồ họa, slide), GuitarTuna, Hợp Âm Chuẩn, ChatGPT/Gemini"
    ai_use: "ChatGPT/Gemini – lập lộ trình học guitar cá nhân hóa (minh họa trong video); CapCut – khử nhiễu âm thanh"
    product:
      intro: "Sản phẩm là video nhóm dài 5 phút. Dưới đây là cấu trúc kịch bản và nội dung chính của video; bản kịch bản và báo cáo đầy đủ ở cuối trang."
      blocks:
        - type: showcase
          title: "Ứng dụng AI & Công nghệ số trong Dạy và Học Guitar"
          subtitle: "Video nhóm 5 phút, chia thành 5 phần"
          steps:
            - { icon: "🎬", t: "0:00 – 0:50 Mở đầu", d: "Giới thiệu thành viên; tình huống Kiên gặp khó khăn khi học đàn; giới thiệu chủ đề." }
            - { icon: "🎸", t: "0:50 – 2:00 GuitarTuna", d: "Lên dây đàn chuẩn xác và luyện nhịp theo thời gian thực." }
            - { icon: "🎼", t: "2:00 – 3:05 Hợp Âm Chuẩn", d: "Thư viện hợp âm bài hát Việt Nam và tự động dịch giọng." }
            - { icon: "🤖", t: "3:05 – 4:20 AI soạn giáo án", d: "ChatGPT/Gemini làm trợ lý sư phạm; đánh giá hạn chế và cách khắc phục của 3 công cụ." }
            - { icon: "💬", t: "4:20 – 5:00 Kết luận", d: "Thông điệp cốt lõi và cả nhóm chào kết." }

        - type: points
          title: "Ba công cụ được giới thiệu trong video"
          items:
            - t: "GuitarTuna"
              d: "Ứng dụng lên dây đàn và hỗ trợ luyện tập. AI nhận diện âm thanh (Audio Recognition) kết hợp thuật toán phân tích cao độ (Pitch Detection), lọc tạp âm qua micro điện thoại để đo độ chuẩn của dây theo thời gian thực. Tính năng chính: tự nhận diện nốt/dây, báo màu xanh khi dây đạt chuẩn; máy đếm nhịp (Metronome) để luyện ngón."
            - t: "Hợp Âm Chuẩn"
              d: "Thư viện hợp âm số hóa cho nhạc Việt Nam. Tìm kiếm thông minh (xử lý ngôn ngữ tự nhiên – NLP) theo tên bài, ca sĩ hoặc một đoạn lời kể cả khi gõ sai; thuật toán chuyển tông (Transposition) đổi giọng mà giữ nguyên tính chất hòa âm. Tính năng chính: thư viện phân loại rõ, tự động dịch giọng theo tầm giọng, tự động cuộn trang khi đang đàn."
            - t: "ChatGPT / Gemini"
              d: "Mô hình ngôn ngữ lớn đóng vai trò trợ lý sư phạm: phân tích yêu cầu (prompt) để tổng hợp kiến thức nhạc lý, thiết kế bài tập luyện ngón và lập lộ trình học guitar cá nhân hóa theo độ tuổi, trình độ."

        - type: table
          title: "Hạn chế và cách khắc phục"
          headers: ["Công cụ", "Hạn chế cốt lõi", "Cách khắc phục"]
          rows:
            - ["GuitarTuna", "Môi trường ồn hoặc micro điện thoại kém khiến AI nhiễu, nhận sai cao độ hoặc chập chờn.", "Lên dây ở nơi yên tĩnh, hoặc dùng thêm bộ lên dây kẹp đàn (clip-on tuner) nhận độ rung."]
            - ["Hợp Âm Chuẩn", "Dữ liệu do người dùng đóng góp nên có bản sai nốt, sai hợp âm; dịch giọng tự động đôi khi tạo thế bấm quá khó.", "Giáo viên thẩm định bản nhạc trước khi giao cho học sinh và điều chỉnh thế bấm phù hợp với tay người học."]
            - ["ChatGPT / Gemini", "Không đánh giá được thể trạng thực tế (ngón tay, lực bấm, cổ tay) nên dễ gợi ý bài tập gây đau tay, sai tư thế; thiếu cảm xúc sư phạm.", "Áp dụng mô hình con người kiểm duyệt (Human-in-the-Loop): AI chỉ là khung tham khảo, giáo viên trực tiếp kiểm tra và nắn tư thế cho học sinh."]

        - type: note
          text: "Thông điệp của video: công nghệ số và AI là những trợ lý đắc lực giúp việc dạy và học guitar trực quan, tiết kiệm thời gian hơn, nhưng không thể thay thế sự nắn chỉnh tỉ mỉ và cảm xúc mà người thầy âm nhạc truyền cho học trò."
      links:
        - label: "Bản gốc đầy đủ: “BÀI TẬP NHÓM GIỮA KỲ NHÓM 4” trên Google Docs"
          url: "https://docs.google.com/document/d/10IseipNV7_x3kZ6V10kLViIfkkfd0Y9trUb0u7uiARM/edit?usp=sharing"

