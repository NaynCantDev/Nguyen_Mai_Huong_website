projects:
  - id: 1
    section: "1.4"
    title: "Thao tác cơ bản với tệp tin và thư mục"
    chapter: "Chương 1 – Máy tính và các thiết bị ngoại vi"
    objective: "Rèn luyện kỹ năng tạo, đổi tên, sao chép, di chuyển và xóa tệp tin, thư mục một cách thành thạo trên Windows bằng File Explorer, theo đúng trình tự bài thực hành của chương 1. Qua đó hình thành thói quen tổ chức dữ liệu cá nhân gọn gàng và đặt tên tệp, thư mục theo một quy tắc thống nhất để dễ tìm, dễ chia sẻ – điều rất cần khi sau này phải quản lý giáo án, bản nhạc, file ghi âm cho nhiều lớp học."
    process:
      - "Bước 1 – Mở File Explorer: nhấp biểu tượng thư mục màu vàng trên thanh tác vụ (hoặc nhấn Windows + E)."
      - "Bước 2 – Chọn nơi thực hành và tạo thư mục mới: nhấp chuột phải vào khoảng trống → New → Folder, đặt tên ThucHanh_NguyenMaiHuong theo mẫu ThucHanh_hotensinhvien của đề."
      - "Bước 3 – Tạo tệp văn bản: vào thư mục vừa tạo, nhấp chuột phải → New → Text Document, đặt tên GhiChu.txt."
      - "Bước 4 – Tạo thư mục con: nhấp chuột phải → New → Folder, đặt tên TaiLieu."
      - "Bước 5 – Đổi tên tệp: nhấp chuột phải vào GhiChu.txt → Rename, đổi thành GhiChuQuanTrong.txt rồi nhấn Enter."
      - "Bước 6 – Sao chép (Copy & Paste): chọn Copy ở GhiChuQuanTrong.txt, vào TaiLieu và chọn Paste. Tệp có mặt ở cả hai nơi."
      - "Bước 7 – Di chuyển (Cut & Paste): tạo tệp DiChuyen.txt ở thư mục ngoài, chọn Cut, vào TaiLieu và Paste. Tệp biến mất khỏi vị trí cũ, chỉ còn ở TaiLieu."
      - "Bước 8 – Xóa tệp: trong TaiLieu, nhấp chuột phải vào GhiChuQuanTrong.txt → Delete (tệp được chuyển vào Thùng rác), sau đó xóa tiếp DiChuyen.txt; thư mục TaiLieu trống."
      - "Lưu ý: Copy và Cut nằm cạnh nhau trong menu chuột phải nên dễ chọn nhầm – sau mỗi lần dán nên quay lại thư mục gốc kiểm tra: còn tệp cũ là sao chép, mất tệp cũ là di chuyển."
    tool: "File Explorer (Windows 11)"
    ai_use: "Không sử dụng AI"
    product:
      intro: "Cấu trúc thư mục thực hành, quy tắc đặt tên đã áp dụng, bảng đối chiếu với yêu cầu của bài và ảnh chụp từng thao tác."
      blocks:
        - type: tree
          title: "ThucHanh_NguyenMaiHuong (trên Desktop)"
          items:
            - name: "TaiLieu"
              children: ["DiChuyen.txt (di chuyển vào, sau đó xóa)", "GhiChuQuanTrong.txt (bản sao, sau đó xóa)"]
            - name: "GhiChuQuanTrong.txt (đổi tên từ GhiChu.txt)"

        - type: table
          title: "Quy tắc đặt tên đã áp dụng"
          headers: ["Quy tắc", "Ví dụ trong bài", "Vì sao nên làm vậy"]
          rows:
