  - id: 2
    section: "2.4"
    title: "Tìm kiếm và đánh giá thông tin học thuật"
    chapter: "Chương 2 – Khai thác dữ liệu và thông tin"
    # Nguồn: báo cáo nhóm "NHÓM 4 – TC5" (Google Docs). Trang này là bản tóm tắt; bản gốc ở cuối trang.
    objective: "Làm việc theo nhóm (Nhóm 4 – TC5) để tìm và chọn 3 tài liệu học thuật trong nước về chủ đề “Ứng dụng và ảnh hưởng của trí tuệ nhân tạo trong giáo dục và đào tạo”, dùng AI hỗ trợ tóm tắt và phân tích, rồi tự đối chiếu lại để đánh giá độ chính xác và tính hữu ích của AI. Kỹ năng được rèn luyện: chọn nguồn tin học thuật đáng tin cậy, đánh giá điểm mạnh và điểm yếu của từng nguồn, tổng hợp nhiều nguồn thành một bức tranh chung và đọc kết quả của AI một cách phản biện. Trong nhóm, mình phụ trách tóm tắt và phân tích tài liệu."
    process:
      - "Bước 1: Cả nhóm chốt chủ đề “Ứng dụng và ảnh hưởng của AI trong giáo dục và đào tạo”; bạn Trần Quốc Hưng tìm và đề xuất 3 tài liệu từ 3 tạp chí khoa học trong nước: Tạp chí Khoa học và Công nghệ – ĐH Đà Nẵng, Tạp chí Khoa học Pháp lý Việt Nam và Tạp chí Giáo dục."
      - "Bước 2: Mình dùng Gemini để tóm tắt nội dung chính và phân tích điểm mạnh, điểm yếu của từng tài liệu, sau đó biên tập lại thành bảng đánh giá nguồn tin."
      - "Bước 3: Tổng hợp thông tin từ 3 tài liệu thành một bức tranh chung và đề xuất 3 hướng nghiên cứu tiếp theo cho người mới bắt đầu."
      - "Bước 4: So sánh kết quả tóm tắt, phân tích của AI với hiểu biết của nhóm về tài liệu (bạn Vũ Trung Kiên phụ trách)."
      - "Bước 5: Đánh giá công cụ AI về độ chính xác và tính hữu ích (bạn Đặng Thanh Hương), rồi bạn Phạm Thanh Huyền tổng hợp thành báo cáo chung trên Google Docs."
      - "AI: Gemini (bản Flash-Lite) được dùng để tóm tắt, phân tích điểm mạnh/điểm yếu, tổng hợp và gợi ý hướng nghiên cứu. Phần so sánh, đánh giá và kết luận do nhóm tự thực hiện."
      - "Khó khăn: Gemini không mở trực tiếp được liên kết của Tài liệu 1 nên bản tóm tắt chỉ mang tính khái quát, chưa bám vào nội dung bài – nhóm ghi chú rõ hạn chế này trong báo cáo và rút ra nguyên tắc phải đối chiếu với văn bản gốc."
      - "Khó khăn: Ở lượt đầu, AI hiểu sai yêu cầu đề bài nên kết quả trình bày mạch lạc nhưng lạc hướng – nhóm phát hiện kịp thời và điều chỉnh lại câu lệnh cho rõ ràng, cụ thể hơn."
      - "Khó khăn: Tài liệu 3 đăng trên trang có nhiều nội dung nhiễu (menu, quảng cáo, bài liên quan) dễ khiến AI bỏ sót chi tiết – nhóm kiểm tra lại phần bài viết chính trước khi dùng kết quả."
    tool: "Gemini (Flash-Lite), Google Docs, website các tạp chí khoa học"
    ai_use: "Gemini – hỗ trợ tóm tắt, phân tích và gợi ý hướng nghiên cứu; nhóm tự so sánh, đánh giá và kết luận"
    product:
